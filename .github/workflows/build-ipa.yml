
name: Build Ksign IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Xcode build data
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            xcode-cache-${{ runner.os }}-${{ github.workflow }}-

      - name: Build IPA
        run: make

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ksign-IPA
          path: packages/Ksign.ipa
          if-no-files-found: error
          retention-days: 7
